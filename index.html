<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI, Science, Technology &amp; Engineering | Links</title>
<meta name="description" content="Saw it in a Reel? The link is here.">
<meta name="theme-color" content="#eadccd">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #eadccd;
    --panel: #e2d1bc;
    --panel-hi: #e6d7c5;
    --line: #d3bca2;
    --text: #2b1d14;
    --muted: #6b5544;
    --accent: #80451e;
    --accent-ink: #fbf5ec;
    --display: "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
  }

  /* beige wash deepening toward the bottom */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(to bottom, transparent 35%, rgba(176,142,104,0.26) 100%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    top: -180px;
    left: 50%;
    width: 520px;
    height: 360px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(196,140,90,0.07), transparent);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 440px;
    padding: 0 20px 32px;
    display: flex;
    flex-direction: column;
  }

  header { text-align: center; }

  /* cover photo, full-bleed on mobile */
  .cover {
    position: relative;
    margin: 0 -20px;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: #2a1d14;
    /* last strip goes see-through so the page texture carries on */
    mask-image: linear-gradient(to bottom, #000 90%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent 100%);
  }
  .cover img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 85%;
  }
  /* warm glow rising from the page: dark -> caramel -> cream, never grey */
  .cover::before,
  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .cover::before {
    background: linear-gradient(to bottom,
      rgba(143,81,39,0) 68%,
      rgba(143,81,39,0.12) 76%,
      rgba(176,112,62,0.2) 83%,
      rgba(176,112,62,0) 95%);
    mix-blend-mode: screen;
  }
  .cover::after {
    background: linear-gradient(to bottom,
      rgba(234,220,205,0) 71%,
      rgba(204,160,116,0.14) 77%,
      rgba(216,182,145,0.5) 83%,
      rgba(228,209,186,0.86) 88%,
      rgba(234,220,205,0.97) 91.5%,
      var(--bg) 94%);
  }

  .intro {
    position: relative;
    z-index: 2;
    margin-top: -48px;
  }
  .intro h1 { text-shadow: 0 0 18px rgba(234,220,205,0.9); }

  @media (min-width: 480px) {
    .wrap { padding-top: 28px; }
    .cover {
      margin: 0;
      border-radius: 24px 24px 0 0;
    }
  }

  h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .handle {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--accent);
    background: rgba(143,81,39,0.08);
    text-decoration: none;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* invisible hit area, 44px tall */
  .handle::before {
    content: "";
    position: absolute;
    left: -4px;
    right: -4px;
    top: 50%;
    height: 44px;
    transform: translateY(-50%);
  }
  .handle:hover {
    background: rgba(143,81,39,0.16);
    border-color: rgba(143,81,39,0.55);
  }
  .handle:active { transform: scale(0.96); }
  .handle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }
  .handle .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px rgba(143,81,39,0.5);
  }

  .bio {
    margin: 16px auto 0;
    max-width: 30ch;
    color: var(--muted);
    font-size: 1rem;
  }

  .links {
    list-style: none;
    margin: 36px 0 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 12px 16px 12px 12px;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: linear-gradient(180deg, var(--panel-hi), var(--panel));
    color: var(--text);
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .link:hover {
    border-color: rgba(143,81,39,0.55);
    box-shadow: 0 0 0 1px rgba(143,81,39,0.12), 0 12px 28px -14px rgba(110,62,28,0.45);
    transform: translateY(-2px);
  }
  .link:active { transform: translateY(0) scale(0.985); }
  .link:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .icon {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--accent);
    color: var(--accent-ink);
  }
  .icon svg { width: 22px; height: 22px; }

  .text { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-weight: 500;
    font-size: clamp(0.84rem, 3.9vw, 1.02rem);
    letter-spacing: -0.01em;
  }
  .sub {
    display: block;
    margin-top: 2px;
    font-family: var(--mono);
    font-size: clamp(0.6rem, 2.55vw, 0.74rem);
    color: var(--muted);
    letter-spacing: -0.02em;
  }

  .arrow {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--muted);
    transition: transform .18s ease, color .18s ease;
  }
  .link:hover .arrow { color: var(--accent); transform: translate(2px, -2px); }

  footer {
    margin-top: auto;
    padding-top: 56px;
    text-align: center;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: #705948;
  }

  /* staggered load-in */
  .reveal {
    opacity: 0;
    transform: translateY(10px);
    animation: rise .55s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: calc(var(--i, 0) * 90ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; animation: none; }
    .link, .arrow, .handle { transition: none; }
    .link:hover, .link:active, .handle:active { transform: none; }
    .link:hover .arrow { transform: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="cover reveal" style="--i:0">
        <img src="cover.jpg" alt="Portrait in front of trees wrapped in string lights at night" width="1000" height="1499" decoding="async" fetchpriority="high">
      </div>
      <div class="intro">
        <h1 class="reveal" style="--i:1;font-size:1.4rem;text-wrap:balance">AI, Science, Technology &amp; Engineering</h1>
        <a class="handle reveal" style="--i:2" href="https://www.instagram.com/aiwith.ak/" target="_blank" rel="noopener noreferrer" aria-label="@aiwith.ak on Instagram (opens in a new tab)"><span class="dot" aria-hidden="true"></span>@aiwith.ak</a>
        <p class="bio reveal" style="--i:3">Saw it in a Reel? The link is here.</p>
      </div>
    </header>

    <nav aria-label="Links">
      <ul class="links" id="links"></ul>
    </nav>

    <footer>&copy; 2026. All rights reserved.</footer>
  </main>

  <script>
    const ICONS = {
      mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8.5 21h7"/></svg>',
      link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
    };

    const LINKS = [
      {
        title: "Wispr Flow: AI Voice Keyboard",
        subtitle: "Get it on the App Store",
        url: "https://apps.apple.com/us/app/wispr-flow-ai-voice-keyboard/id6497229487",
        icon: "mic"
      },
      {
        title: "AI Research Before 2027 Begins",
        subtitle: "aiwithak-ig.github.io/ai-research-2026",
        url: "https://aiwithak-ig.github.io/ai-research-2026",
        icon: "link"
      },
      // next link goes here
    ];

    const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>';

    const list = document.getElementById("links");
    LINKS.forEach((l, idx) => {
      const li = document.createElement("li");
      li.className = "reveal";
      li.style.setProperty("--i", 4 + idx);

      const a = document.createElement("a");
      a.className = "link";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML =
        '<span class="icon">' + (ICONS[l.icon] || ICONS.mic) + '</span>' +
        '<span class="text"><span class="title"></span><span class="sub"></span></span>' +
        ARROW;
      a.querySelector(".title").textContent = l.title;
      a.querySelector(".sub").textContent = l.subtitle;
      a.setAttribute("aria-label", l.title + ", " + l.subtitle + " (opens in a new tab)");

      li.appendChild(a);
      list.appendChild(li);
    });

    // footer animates in after the last link
    const foot = document.querySelector("footer");
    foot.classList.add("reveal");
    foot.style.setProperty("--i", 4 + LINKS.length);
  </script>
</body>
</html>
